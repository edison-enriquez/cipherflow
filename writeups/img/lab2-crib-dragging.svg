<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 446" width="1040" height="446" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
<rect width="1040" height="446" rx="10" fill="#000000"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7d7d7d"/></marker></defs>
<text x="32" y="38" fill="#ffffff" font-size="13" font-weight="700" text-anchor="start">c1 ⊕ c2 = m1 ⊕ m2  —  cada cuña conocida de un mensaje destapa el mismo tramo del otro</text><text x="32" y="62" fill="#7d7d7d" font-size="11.5" font-weight="400" text-anchor="start">Salida real del bloque XOR (clave UTF8 = la cuña, que se repite): lo legible es exactamente la longitud de la cuña.</text><text x="32" y="94" fill="#7d7d7d" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">CUÑA (CLAVE DEL XOR)</text><text x="470" y="94" fill="#7d7d7d" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">RESULTADO: (M1 ⊕ M2) ⊕ CUÑA</text><rect x="24" y="110" width="992" height="62" rx="6" fill="#0f0f0f" stroke="#2e2e2e" stroke-width="1"/><text x="40" y="134" fill="#7d7d7d" font-size="11" font-weight="700" text-anchor="start">Paso 1</text><text x="110" y="134" fill="#7d7d7d" font-size="11" font-weight="400" text-anchor="start">cuña de m1 → sale m2</text><text x="40" y="158" fill="#ffe066" font-size="12.5" font-weight="400" text-anchor="start">"Nos vemos a"</text><text x="470" y="158" font-size="12.5" fill="#7df7ba" font-weight="700">La clave de<tspan fill="#ff5c5c" font-weight="400">·#q&lt;0sa*ls$G z</tspan></text><rect x="24" y="184" width="992" height="62" rx="6" fill="#0f0f0f" stroke="#2e2e2e" stroke-width="1"/><text x="40" y="208" fill="#7d7d7d" font-size="11" font-weight="700" text-anchor="start">Paso 2</text><text x="110" y="208" fill="#7d7d7d" font-size="11" font-weight="400" text-anchor="start">cuña de m2 → sale m1</text><text x="40" y="232" fill="#ffe066" font-size="12.5" font-weight="400" text-anchor="start">"La clave del cofre "</text><text x="470" y="232" font-size="12.5" fill="#7df7ba" font-weight="700">Nos vemos a las die<tspan fill="#ff5c5c" font-weight="400">S2ej#hu+)cin-&amp;</tspan></text><rect x="24" y="258" width="992" height="62" rx="6" fill="#0f0f0f" stroke="#2e2e2e" stroke-width="1"/><text x="40" y="282" fill="#7d7d7d" font-size="11" font-weight="700" text-anchor="start">Paso 3</text><text x="110" y="282" fill="#7d7d7d" font-size="11" font-weight="400" text-anchor="start">cuña de m1 → sale m2</text><text x="40" y="306" fill="#ffe066" font-size="12.5" font-weight="400" text-anchor="start">"Nos vemos a las diez en el muelle "</text><text x="470" y="306" font-size="12.5" fill="#7df7ba" font-weight="700">La clave del cofre es golondrina a<tspan fill="#ff5c5c" font-weight="400">Zor~$d"&lt;i 5)/a</tspan></text><rect x="24" y="332" width="992" height="62" rx="6" fill="#0f0f0f" stroke="#2e2e2e" stroke-width="1"/><text x="40" y="356" fill="#7d7d7d" font-size="11" font-weight="700" text-anchor="start">Paso 4</text><text x="110" y="356" fill="#7d7d7d" font-size="11" font-weight="400" text-anchor="start">cuña de m1 → sale m2</text><text x="40" y="380" fill="#ffe066" font-size="12.5" font-weight="400" text-anchor="start">"Nos vemos a las diez en el muelle numero…"</text><text x="470" y="380" font-size="12.5" fill="#7df7ba" font-weight="700">La clave del cofre es golondrina azul; no se lo digas a nadie ho<tspan fill="#ff5c5c" font-weight="400"></tspan></text><text x="1000" y="356" fill="#7df7ba" font-size="11" font-weight="400" text-anchor="end">m1 completo → m2 completo (64 B)</text><text x="32" y="422" fill="#7d7d7d" font-size="11.5" font-weight="400" text-anchor="start">Verde: texto recuperado · Rojo: la cuña se repite sobre bytes que aún no conoces y sale basura.</text>
</svg>
