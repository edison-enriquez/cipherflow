name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Las pruebas de eval/ ejecutan los ejemplos y el banco con el motor compilado en public/engine
      - name: Motor de CyberChef
        run: npm run engine

      - name: Tests (sin red)
        run: npm test

      - name: Build
        run: npm run build

      - name: Check output
        run: node scripts/check-dist.mjs
